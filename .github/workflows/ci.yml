name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore VeloApp.sln

      - name: Build
        run: dotnet build VeloApp.sln --no-restore -c Release

      - name: Test
        run: dotnet test VeloApp.sln --no-build -c Release --verbosity normal
